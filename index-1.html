<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C66">
<title>Ruta Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #EDF0EE; --surface: #FFFFFF; --ink: #14211D; --muted: #5B6B66; --line: #D3DBD8;
  --accent: #0E7C66; --accent-ink: #FFFFFF;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1816; --surface: #172421; --ink: #E6EFEB; --muted: #92A59E; --line: #2A3A36; --accent: #3CC9A5; --accent-ink: #08201A; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.35; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { color: var(--accent); flex: none; }
.brand h1 { margin: 0; font: 700 24px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.mode { font: 600 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; white-space: nowrap; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.mode.live i { background: #1FA971; }
.mode.warn i { background: #D98A0B; }

.mapwrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.leaflet-container { font-family: var(--font-body); }
.cross { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; z-index: 1000; }
.ctl { position: absolute; right: 12px; bottom: 28px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
.ctl button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 1100; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; }

.sheet { background: var(--surface); border-top: 1px solid var(--line); max-height: 44vh; overflow-y: auto; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { margin: 0 0 8px; font: 700 15px/1.1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 500; }
.chip i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); flex: none; }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.go { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 700 18px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
.go:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.near { margin-top: 18px; }
.list { list-style: none; margin: 0; padding: 0; }
.empty { color: var(--muted); padding: 10px 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 12px 8px; border-top: 1px solid var(--line); border-radius: 6px; }
.item.sel { background: var(--bg); box-shadow: inset 3px 0 0 var(--c); }
.item.cleared .info { opacity: .5; }
.info { min-width: 0; cursor: pointer; }
.tag { display: inline-block; font: 700 13px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--c); border-radius: 4px; padding: 4px 7px 3px; margin-bottom: 5px; }
.place { display: block; font-weight: 600; }
.sub { display: block; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.acts { display: flex; gap: 6px; }
.acts button { min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.acts button:disabled { opacity: .5; cursor: default; }
.foot { margin: 14px 0 0; color: var(--muted); font-size: 12px; }
.me-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--accent), 0 1px 4px rgba(0,0,0,.4); }
@media (max-width: 420px) { .acts button { padding: 0 8px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="16" cy="16" r="3" fill="currentColor" stroke="none"/>
        <path d="M9.5 16a6.5 6.5 0 0 1 6.5-6.5"/><path d="M4.5 16A11.5 11.5 0 0 1 16 4.5"/><path d="M16 16 26 8"/>
      </svg>
      <h1>Ruta Radar</h1>
    </div>
    <span class="mode" id="mode"><i></i><span id="modeText">Solo en este celular</span></span>
  </header>

  <div class="mapwrap">
    <div id="map"></div>
    <svg class="cross" viewBox="0 0 44 44" fill="none" aria-hidden="true">
      <g stroke="#fff" stroke-width="5" stroke-linecap="round"><circle cx="22" cy="22" r="7"/><path d="M22 3v9M22 32v9M3 22h9M32 22h9"/></g>
      <g stroke="#14211D" stroke-width="2.2" stroke-linecap="round"><circle cx="22" cy="22" r="7"/><path d="M22 3v9M22 32v9M3 22h9M32 22h9"/></g>
    </svg>
    <div class="ctl">
      <button id="zin" aria-label="Acercar"><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3v12M3 9h12"/></svg></button>
      <button id="zout" aria-label="Alejar"><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9h12"/></svg></button>
      <button id="me" aria-label="Ir a mi ubicación"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="3.2"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"/></svg></button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <section class="sheet" aria-label="Reportes">
    <h2>¿Qué hay en la vía?</h2>
    <div class="chips" id="chips"></div>
    <button class="go" id="go" disabled>Elige un tipo de reporte</button>
    <div class="near">
      <h2>Cerca de ti</h2>
      <ul class="list" id="list"></ul>
    </div>
    <p class="foot">Mueve el mapa hasta que la mira quede sobre el lugar y toca el botón. Los reportes se borran solos a las 6 horas. Mapa © colaboradores de OpenStreetMap.</p>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   CONFIGURACIÓN
   Para que los reportes los vean todos los usuarios, pega aquí
   la configuración de tu proyecto de Firebase (mira LEEME.md).
   Mientras sea null, los reportes se guardan solo en este celular.
   ============================================================ */
var FIREBASE_CONFIG = null;
/* Ejemplo:
var FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "...", projectId: "...",
  storageBucket: "...", messagingSenderId: "...", appId: "..."
};
*/

(function () {
  var $ = function (s) { return document.querySelector(s); };
  var MAX_AGE = 6 * 3600 * 1000;
  var DEFAULT_CENTER = [4.7110, -74.0721]; // Bogotá, hasta que llegue tu ubicación
  var MIN = 60000;

  var TYPES = {
    accidente: { label: 'Accidente', c: '#D6402A', g: '<rect x="-1.6" y="-8" width="3.2" height="9" rx="1.2"/><circle cy="5" r="1.9"/>' },
    derrumbe:  { label: 'Derrumbe', c: '#D6402A', g: '<circle cx="-4" cy="3" r="3"/><circle cx="3.2" cy="3.4" r="3.2"/><circle cx="0" cy="-3.6" r="3"/>' },
    cerrada:   { label: 'Vía cerrada', c: '#D6402A', g: '<rect x="-7" y="-2.2" width="14" height="4.4" rx="1.6"/>' },
    reten:     { label: 'Retén', c: '#2F6FB5', g: '<path d="M0 -8 L7.5 6 L-7.5 6 Z"/>' },
    trancon:   { label: 'Trancón', c: '#C77A08', g: '<rect x="-7" y="-6.4" width="14" height="2.8" rx="1"/><rect x="-7" y="-1.4" width="10" height="2.8" rx="1"/><rect x="-7" y="3.6" width="14" height="2.8" rx="1"/>' },
    hueco:     { label: 'Hueco', c: '#C77A08', g: '<ellipse rx="7" ry="3.8"/>' }
  };

  var reports = [], selected = null, chosen = null, me = null, lastReportAt = 0;
  var votes = {};
  try { votes = JSON.parse(localStorage.getItem('rr_votes') || '{}'); } catch (e) {}

  /* ---------- mapa ---------- */
  var map = L.map('map', { zoomControl: false }).setView(DEFAULT_CENTER, 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  map.attributionControl.setPosition('bottomleft');
  var layer = L.layerGroup().addTo(map);
  $('#zin').addEventListener('click', function () { map.zoomIn(); });
  $('#zout').addEventListener('click', function () { map.zoomOut(); });
  window.addEventListener('resize', function () { map.invalidateSize(); });
  setTimeout(function () { map.invalidateSize(); }, 300);

  /* ---------- ubicación ---------- */
  var meMarker = null, meAccuracy = null, firstFix = false;
  function onFix(pos) {
    me = [pos.coords.latitude, pos.coords.longitude];
    if (!meMarker) {
      meAccuracy = L.circle(me, { radius: pos.coords.accuracy, stroke: false, fillColor: '#0E7C66', fillOpacity: .12, interactive: false }).addTo(map);
      meMarker = L.marker(me, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false, keyboard: false }).addTo(map);
    } else {
      meMarker.setLatLng(me); meAccuracy.setLatLng(me); meAccuracy.setRadius(pos.coords.accuracy);
    }
    if (!firstFix) { firstFix = true; map.setView(me, 16); }
    renderList();
  }
  function onGeoError(err) {
    toast(err && err.code === 1 ? 'Activa el permiso de ubicación para ver dónde estás.' : 'No pude obtener tu ubicación todavía.');
  }
  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(onFix, onGeoError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  } else { toast('Este navegador no tiene ubicación.'); }
  $('#me').addEventListener('click', function () {
    if (me) map.setView(me, Math.max(map.getZoom(), 16)); else toast('Todavía no tengo tu ubicación.');
  });

  /* ---------- utilidades ---------- */
  function dist(a, b) { // metros, fórmula haversine
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function fmtDist(d) { return d >= 1000 ? (d / 1000).toFixed(1).replace('.', ',') + ' km' : (Math.max(10, Math.round(d / 10) * 10)) + ' m'; }
  function ago(t) {
    var m = Math.floor((Date.now() - t) / MIN);
    if (m < 1) return 'ahora';
    if (m < 60) return 'hace ' + m + ' min';
    return 'hace ' + Math.floor(m / 60) + ' h';
  }
  function isCleared(r) { return r.no >= 3 && r.no > r.yes / 3; }
  function visible() { var lim = Date.now() - MAX_AGE; return reports.filter(function (r) { return r.createdAt > lim && TYPES[r.type]; }); }
  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2800);
  }
  function setMode(kind, text) {
    $('#mode').className = 'mode ' + kind; $('#modeText').textContent = text;
  }

  /* ---------- almacenamiento: Firebase o local ---------- */
  var col = null;
  function loadLocal() {
    try { reports = JSON.parse(localStorage.getItem('rr_reports') || '[]'); } catch (e) { reports = []; }
  }
  function saveLocal() { try { localStorage.setItem('rr_reports', JSON.stringify(reports)); } catch (e) {} }

  function initStore() {
    if (FIREBASE_CONFIG && window.firebase) {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        col = firebase.firestore().collection('reports');
        setMode('live', 'En vivo');
        col.where('createdAt', '>', Date.now() - MAX_AGE).onSnapshot(function (snap) {
          reports = snap.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; });
          renderAll();
        }, function () {
          col = null; loadLocal(); setMode('warn', 'Sin conexión al servidor'); renderAll();
        });
        return;
      } catch (e) { col = null; }
    }
    loadLocal();
    setMode(FIREBASE_CONFIG ? 'warn' : '', FIREBASE_CONFIG ? 'Sin conexión al servidor' : 'Solo en este celular');
    renderAll();
  }

  function addReport(r) {
    if (col) {
      return col.add(r).catch(function () { toast('No se pudo guardar. Revisa las reglas de Firestore.'); });
    }
    r.id = 'l' + Date.now() + Math.floor(Math.random() * 1000);
    reports.push(r); saveLocal(); renderAll();
    return Promise.resolve(r.id);
  }
  function vote(id, key) {
    if (votes[id]) return;
    votes[id] = key;
    try { localStorage.setItem('rr_votes', JSON.stringify(votes)); } catch (e) {}
    if (col) {
      var up = {}; up[key] = firebase.firestore.FieldValue.increment(1);
      col.doc(id).update(up).catch(function () { toast('No se pudo registrar tu voto.'); });
    } else {
      reports.forEach(function (r) { if (r.id === id) r[key]++; });
      saveLocal(); renderAll();
    }
    renderList();
  }

  /* ---------- dibujo ---------- */
  function pinHtml(r, sel) {
    var t = TYPES[r.type], w = sel ? 38 : 32, h = sel ? 52 : 44;
    return '<div style="opacity:' + (isCleared(r) ? .45 : 1) + '"><svg viewBox="-16 -42 32 44" width="' + w + '" height="' + h + '">' +
      '<path d="M0 0C-2-8-14-14-14-26A14 14 0 1 1 14-26C14-14 2-8 0 0Z" fill="' + t.c + '" stroke="#fff" stroke-width="2.4"/>' +
      '<g transform="translate(0 -26)" fill="#fff">' + t.g + '</g></svg></div>';
  }
  function renderPins() {
    layer.clearLayers();
    visible().forEach(function (r) {
      var sel = r.id === selected, w = sel ? 38 : 32, h = sel ? 52 : 44;
      var m = L.marker([r.lat, r.lng], {
        icon: L.divIcon({ className: '', html: pinHtml(r, sel), iconSize: [w, h], iconAnchor: [w / 2, Math.round(h * 42 / 44)] }),
        keyboard: false, zIndexOffset: sel ? 1000 : 0
      });
      m.on('click', function () { select(r.id, false); });
      layer.addLayer(m);
    });
  }
  function renderList() {
    var ref = me || [map.getCenter().lat, map.getCenter().lng];
    var refText = me ? 'de ti' : 'del centro del mapa';
    var items = visible().map(function (r) { return { r: r, d: dist(ref, [r.lat, r.lng]) }; })
      .sort(function (a, b) { return a.d - b.d; });
    var ul = $('#list');
    if (!items.length) { ul.innerHTML = '<li class="empty">Todavía no hay reportes. Sé la primera persona en avisar.</li>'; return; }
    ul.innerHTML = items.map(function (x) {
      var r = x.r, t = TYPES[r.type], v = votes[r.id], off = v ? ' disabled' : '';
      return '<li class="item' + (r.id === selected ? ' sel' : '') + (isCleared(r) ? ' cleared' : '') + '" data-id="' + r.id + '" style="--c:' + t.c + '">' +
        '<div class="info" data-act="go"><span class="tag">' + t.label + '</span>' +
        '<span class="place">A ' + fmtDist(x.d) + ' ' + refText + '</span>' +
        '<span class="sub">' + ago(r.createdAt) + (isCleared(r) ? ' · Despejado' : '') + '</span></div>' +
        '<div class="acts"><button data-act="yes"' + off + '>Sigue ahí · ' + (r.yes || 0) + '</button>' +
        '<button data-act="no"' + off + '>Ya pasó · ' + (r.no || 0) + '</button></div></li>';
    }).join('');
  }
  function renderAll() { renderPins(); renderList(); }

  function select(id, center) {
    selected = id;
    var r = reports.filter(function (x) { return x.id === id; })[0];
    if (r && center) map.setView([r.lat, r.lng], Math.max(map.getZoom(), 16));
    renderAll();
    var li = document.querySelector('.item[data-id="' + id + '"]');
    if (li) li.scrollIntoView({ block: 'nearest' });
  }
  $('#list').addEventListener('click', function (e) {
    var li = e.target.closest('.item'); if (!li) return;
    var act = e.target.closest('[data-act]'); if (!act || act.disabled) return;
    var id = li.getAttribute('data-id'), a = act.getAttribute('data-act');
    if (a === 'yes') vote(id, 'yes'); else if (a === 'no') vote(id, 'no'); else select(id, true);
  });
  map.on('moveend', function () { if (!me) renderList(); });

  /* ---------- reportar ---------- */
  var chips = $('#chips'), go = $('#go');
  chips.innerHTML = Object.keys(TYPES).map(function (k) {
    return '<button class="chip" data-type="' + k + '" aria-pressed="false" style="--c:' + TYPES[k].c + '"><i></i>' + TYPES[k].label + '</button>';
  }).join('');
  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    chosen = b.getAttribute('data-type');
    chips.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); });
    go.disabled = false;
    go.textContent = 'Reportar ' + TYPES[chosen].label.toLowerCase() + ' aquí';
  });
  go.addEventListener('click', function () {
    if (!chosen) return;
    if (Date.now() - lastReportAt < 20000) { toast('Espera unos segundos antes de hacer otro reporte.'); return; }
    var c = map.getCenter();
    lastReportAt = Date.now();
    var label = TYPES[chosen].label;
    addReport({ type: chosen, lat: Math.round(c.lat * 1e6) / 1e6, lng: Math.round(c.lng * 1e6) / 1e6, createdAt: Date.now(), yes: 1, no: 0 })
      .then(function () { toast(label + ' reportado'); });
    chosen = null;
    chips.querySelectorAll('.chip').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
    go.disabled = true; go.textContent = 'Elige un tipo de reporte';
  });

  setInterval(renderList, 30000);
  initStore();
})();
</script>
</body>
</html>
